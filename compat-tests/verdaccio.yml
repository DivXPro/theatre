store:
  memory:
    limit: 10000
# r3f's extension bundle makes its tarball ~9MB; the default body limit rejects it
max_body_size: 100mb
auth:
  auth-memory:
    users:
      test:
        name: test
        password: test
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: false
packages:
  '@dreamerbird/*':
    access: $all
    publish: $all
  '@dreamerbird/theatric':
    access: $all
    publish: $all
  '@*/*':
    access: $all
    publish: $all
    proxy: npmjs
  '**':
    access: $all
    proxy: npmjs
logs:
  type: stdout
  format: pretty
  level: error

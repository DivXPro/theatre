name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    runs-on: buildjet-8vcpu-ubuntu-2204

    strategy:
      matrix:
        node-version: [20.9]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/pnpm-install

      - run: pnpm cli build
  Lint:
    runs-on: buildjet-8vcpu-ubuntu-2204

    strategy:
      matrix:
        node-version: [20.9]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/pnpm-install

      - run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          pnpm lint:all --max-warnings 0

  Test:
    runs-on: buildjet-8vcpu-ubuntu-2204

    strategy:
      matrix:
        node-version: [20.9]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/pnpm-install

      - run: pnpm test

      - name: API report in sync
        run: pnpm --filter @dreamerbird/core run build:api-json && git diff --exit-code packages/core/etc/core.api.md

  VisualRegression:
    # skip this until the new API is ready
    if: false
    name: Visual regression tests
    runs-on: buildjet-8vcpu-ubuntu-2204

    strategy:
      matrix:
        node-version: [20.9]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/pnpm-install

      - name: Run e2e tests
        run: pnpm test:e2e:ci

  Compatibility-Tests:
    # skip this until the new API is ready
    if: false
    runs-on: buildjet-8vcpu-ubuntu-2204

    strategy:
      matrix:
        node-version: [20.9]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/pnpm-install
      # re-enable the following line if we start to get EINTEGRITY errors again
      # - run: npm cache clean || npm cache verify
      # This will test whether `npm install`/`yarn install` can actually run on each compatibility test fixture. See `compat-tests/README.md` for more info.
      - run: pnpm --filter @dreamerbird/compat-tests run install-fixtures --verbose
      # after that, we run the jest tests for each fixture
      - run: pnpm test:compat:run --verbose

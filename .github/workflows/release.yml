name: Release

# Publishes @dreamerbird packages to npm when a version tag (v1.2.3) is pushed.
# The tag must match the package.json version of at least one publishable
# package; packages whose version already exists on npm are skipped, so
# re-running a failed release is safe.
#
# Requires the NPM_TOKEN repository secret (npm automation token with
# publish rights on the @dreamerbird scope). setup-node 的 registry-url
# 会把 NODE_AUTH_TOKEN 写进 ~/.npmrc,pnpm publish 直接读取。
on:
  push:
    tags: ['v*']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.9
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-release-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run postinstall
        # prisma client 生成在源码树(packages/*/prisma/client-generated,
        # 不入 git 也不入缓存),缺了它 Build 的 tsc 直接 TS2307——yarn
        # 时代缓存命中跳过 install 曾踩过,这里无条件补跑。
        run: pnpm postinstall

      - name: Build all packages
        run: |
          pnpm cli build
          pnpm --filter @dreamerbird/camera-studio run build:ts
          pnpm --filter @dreamerbird/camera-studio-bridge run build:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test agent-facing packages
        # The full `pnpm test` suite carries known environment-sensitive
        # failures (docker-compose check, studio integration tests); the
        # release gate covers the packages this workflow ships plus the
        # agent API surface.
        run: pnpm test packages/camera-studio packages/camera-studio-bridge --runInBand

      - name: Publish packages whose version is missing from npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/stable-release.mjs
